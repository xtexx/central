[package]
name = "tg-stickers-to-phorge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
dotenvy = "0.15.7"
env_logger = "0.11.8"
log = { version = "0.4.27", features = ["std", "max_level_info", "release_max_level_info"] }
reqwest = { version = "0.12.22", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.46.1", features = ["full"] }
