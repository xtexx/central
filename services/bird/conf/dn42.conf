# DN42 filters

roa4 table dn42_roa4;
roa6 table dn42_roa6;
roa4 table dn42_roa_flap4 {
	trie on;
};
roa6 table dn42_roa_flap6 {
	trie on;
};

function check_dn42_roa() -> enum roa {
	case net.type {
		NET_IP4: return roa_check(dn42_roa4, net, bgp_path.last);
		NET_IP6: return roa_check(dn42_roa6, net, bgp_path.last);
		else: print "check_dn42_roa: unexpected net.type ", net.type, " ", net; return ROA_INVALID;
	}
}

function check_dn42_roa_flap() -> bool {
	case net.type {
		NET_IP4: return roa_check(dn42_roa_flap4, net, 0) = ROA_VALID;
		NET_IP6: return roa_check(dn42_roa_flap6, net, 0) = ROA_VALID;
		else: print "check_dn42_roa_flap: unexpected net.type ", net.type, " ", net; return false;
	}
}

protocol static dn42_roa_static4 {
	roa4 { table dn42_roa4; };
	route 172.20.206.64/27 max 29 as 4242420361;
	include "/var/cache/bird/dn42_roa_v4.conf";
};

protocol static dn42_roa_static6 {
	roa6 { table dn42_roa6; };
	route fd00:443a:ef14::/48 max 48 as 4242420361;
	include "/var/cache/bird/dn42_roa_v6.conf";
};

define DN42_PREFIXES_V4 = [
	172.20.0.0/14{21,29},	# dn42
	172.20.0.0/24{28,32},	# dn42 Anycast
	172.21.0.0/24{28,32},	# dn42 Anycast
	172.22.0.0/24{28,32},	# dn42 Anycast
	172.23.0.0/24{28,32},	# dn42 Anycast
	172.31.0.0/16+,			# ChaosVPN
	10.100.0.0/14+,			# ChaosVPN
	10.127.0.0/16{16,32},	# NeoNetwork
	10.0.0.0/8{15,24}		# IC-VPN / Freifunk.net
];

function is_dn42_prefix() -> bool {
	case net.type {
		NET_IP4: return net ~ DN42_PREFIXES_V4;
		NET_IP6: return net ~ [ fd00::/8{44,64} ];
		else: print "is_dn42_prefix: unexpected net.type ", net.type, " ", net; return false;
	}
}

define COMMUNITY_DN42_UNSAFE = [ (64511, 31..32) ];

% dn42ExportPrefixesV4=('172.20.206.64/27')
% dn42ExportPrefixesV6=('fd00:443a:ef14::/48')

define DN42_EXPORT_PREFIXES_V4 = [ <%% IFS=','; echo "${dn42ExportPrefixesV4[*]}" %> ];
define DN42_EXPORT_PREFIXES_V6 = [ <%% IFS=','; echo "${dn42ExportPrefixesV6[*]}" %> ];

protocol static dn42_static4 {
	% for prefix in "${dn42ExportPrefixesV4[@]}"; do
	route <% $prefix %> reject;
	% done

	ipv4 { import all; export none; };
};

protocol static dn42_static6 {
	% for prefix in "${dn42ExportPrefixesV6[@]}"; do
	route <% $prefix %> reject;
	% done

	ipv6 { import all; export none; };
};

function is_dn42_export_prefix() -> bool {
	case net.type {
		NET_IP4: return net ~ DN42_EXPORT_PREFIXES_V4;
		NET_IP6: return net ~ DN42_EXPORT_PREFIXES_V6;
		else: print "is_dn42_export_prefix: unexpected net.type ", net.type, " ", net; return false;
	}
}

filter dn42_import {
	if ! is_dn42_prefix() then {
		reject "[dn42] reject non-DN42 route: ", net, ", ", bgp_path.last, ", ", proto;
	}
	if is_xvnet_prefix() then reject;
	if bgp_path.len > 10 then {
		reject "[dn42] reject too long path ", net, ", ", bgp_path.len, " AS on path, ", proto, ", ", bgp_path;
	}
	if check_dn42_roa() != ROA_VALID then {
		reject; # "[dn42] ROA failed for ", net, " ASN ", bgp_path.last, ", ", proto;
	}
	if check_dn42_roa_flap() then {
		reject; # "[dn42] reject flapping route: ", net, ", ", bgp_path.last, ", ", proto;
	}
	if bgp_community ~ COMMUNITY_DN42_UNSAFE then bgp_large_community.add(COMMUNITY_XVN_UNSAFE_TRANSIT);

	if COMMUNITY_XVN_UNSAFE_TRANSIT ~ bgp_large_community then bgp_local_pref = bgp_local_pref - 20;
	accept;
}

filter dn42_export {
	if !is_dn42_prefix() then reject;
	if is_xvnet_prefix() && !is_dn42_export_prefix() then reject;

	strip_confed_as();
	if COMMUNITY_XVN_UNSAFE_TRANSIT ~ bgp_large_community
		then bgp_community.add((64511, 32));
		else bgp_community.add((64511, 34));
	bgp_large_community.add(COMMUNITY_XVN_EXPORT_SELF);
	accept;
}

template bgp dn42_peer {
	local as 4242420361;
	graceful restart on;
	enable extended messages on;
	advertise hostname on;

	ipv4 {
		import filter dn42_import;
		export filter dn42_export;
		import limit 2000 action block;
		export limit 2000 action disable;
		extended next hop on;
	};

	ipv6 {
		import filter dn42_import;
		export filter dn42_export;
		import limit 2000 action block;
		export limit 2000 action disable;
		extended next hop on;
	};
}

protocol bgp dn42_grc from dn42_peer {
	neighbor fd42:d42:d42:179::1 as 4242422602;
	multihop;
	ipv4 {
		add paths tx;
		import none;
		export limit off;
	};
	ipv6 {
		add paths tx;
		import none;
		export limit off;
	};
};

protocol rpki dn42_roa_strexp {
    roa4 { table dn42_roa_flap4; };
    roa6 { table dn42_roa_flap6; };

    remote "rpki.nia.dn42" port 8083;
	local address XVNET_LOCAL_IP;

    retry keep 120;
    refresh keep 300;
    expire keep 600;
}

include "/etc/bird/dn42.conf";
