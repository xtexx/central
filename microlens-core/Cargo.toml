[package]
name = "microlens-core"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { version = "2.2.7", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "serde_json", "uuid", "time"] }
diesel_migrations = { version = "2.2.0", features = ["sqlite"] }
kstring = { version = "2.0.2", features = ["serde"] }
libsqlite3-sys = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
thiserror = "2.0.11"
time = { version = "0.3.37", features = ["serde"] }
uuid = { version = "1.12.1", features = ["fast-rng", "serde", "v4"] }
