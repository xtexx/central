#:schema https://vide.pascal-lab.net/schemas/v1/vide.schema.json
sources = [
  "rtl/**",
  "vendor/tech_cells_generic/src/rtl/*",
  "vendor/common_cells/src/*",
  "vendor/axi/src/*",
]

include_dirs = [
  "rtl",
  "rtl/backend",
  "rtl/device",
  "rtl/frontend",
  "rtl/gen",
  "rtl/interface",
  "rtl/macros",
  "rtl/utils",

  "vendor/tech_cells_generic/src/rtl",
  "vendor/common_cells/src",
  "vendor/common_cells/include",
  "vendor/axi/src",
  "vendor/axi/include",
]
defines = ["SIMULATION"]
top_modules = ["top", "testbench"]
libraries = [
  "vendor/tech_cells_generic/src/rtl",
  "vendor/common_cells/src",
  "vendor/axi/src",
]
exclude = ["build/**"]
