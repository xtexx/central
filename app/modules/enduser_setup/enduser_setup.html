<!DOCTYPE html>
<html lang="zh">

<head>
	<meta name='viewport' content='width=device-width, initial-scale=1.0'>
	<meta charset="utf-8">
	<title>YAWO设置</title>
	<style type=text/css>
		* {
			margin: 0;
			padding: 0;
		}
		
		html,
		body {
			height: 100%;
			font-family: sans-serif;
			text-align: center;
			background: #444d44;
		}
		
		#content {
			position: absolute;
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			width: 320px;
			height: 480px;
			margin: auto;
		}
		
		input,
		button,
		select {
			-webkit-appearance: none;
			border-radius: 0;
		}
		
		fieldset {
			border: 0;
			box-shadow: 0 0 15px 1px rgba(0, 0, 0, .4);
			box-sizing: border-box;
			padding: 20px 30px;
			background: #fff;
			min-height: 320px;
			margin: -1px;
		}
		
		input {
			border: 1px solid #ccc;
			margin-bottom: 10px;
			width: 100%;
			box-sizing: border-box;
			color: #222;
			font: 16px monospace;
			padding: 15px;
		}
		
		select {
			font: 16px monospace;
			background-color: transparent;
			padding: 15px;
		}
		
		button {
			color: #fff;
			border: 0;
			border-radius: 3px;
			cursor: pointer;
			display: block;
			font: 16px sans-serif;
			text-decoration: none;
			padding: 10px 5px;
			background: #31b457;
			width: 100%;
		}
		
		button:focus,
		button:hover {
			box-shadow: 0 0 0 2px #fff, 0 0 0 3px #31b457;
		}
		
		h3 {
			font-size: 16px;
			color: #666;
			margin-bottom: 20px;
		}
		
		h4 {
			color: #ccc;
			padding: 10px;
		}
		
		.utility {
			float: right;
			clear: both;
			max-width: 75%;
			font-size: 13px;
			color: #222;
			margin: 10px 0;
			padding: 5px 10px;
			background: #ccc;
		}
		
		.utility:focus,
		.utility:hover {
			box-shadow: 0 0 0 2px #fff, 0 0 0 3px #ccc;
		}
		
		#dropdown,
		#f2,
		#f3,
		#bk2 {
			display: none;
		}
		
		#dropdown {
			position: relative;
			width: 100%;
			overflow: auto;
			height: 51px;
			margin-bottom: 10px;
		}
		
		#aplist {
			position: absolute;
			width: 100%;
			height: 100%;
			top: 0;
			left: 0;
			bottom: 0;
			border: 1px solid #ccc;
			font-family: monospace;
			padding: 10px 5px;
		}
		
		#arrow {
			color: #888;
			position: absolute;
			right: 8px;
			top: 15px;
		}
		
		#i {
			text-align: center;
		}
	</style>
</head>

<body>
	<div id=content>
		<fieldset>
			<div id=deviceId></div>
			<div id=f1>
				<h2>Yet-Another-WiFi-Outlet</h2>
				<h3>设置</h3>
				<form action="/setwifi" method="POST">
					<button id=networks type=button class=utility></button>
					<div id=dropdown>
						<span id=arrow>&#x25bc;</span>
						<select id=aplist name=aplist></select>
					</div>
					<input id=ssid name=wifi_ssid type=text autocorrect=off autocapitalize=none placeholder='Wi-Fi名称' />
					<input id=wifi_password name=wifi_password type=password autocorrect=off autocapitalize=none autocomplete=off placeholder='Wi-Fi密码' />

					<input id=server name=server type=text autocorrect=off autocapitalize=none autocomplete=off placeholder='服务器地址' />
					<input id=server_port name=server_port type=text autocorrect=off autocapitalize=none autocomplete=off placeholder='服务器端口' />
					<input id=gpio_idx name=gpio_idx type=text autocorrect=off autocapitalize=none autocomplete=off placeholder='GPIO的IO索引' value=2 />

					<input type="submit" value="保存"/>
				</form>
			</div>
			<div id=f2>
				<h1>成功！</h1>
				<div id=i>
					<h3>设备已连接至Wi-Fi网络。<br /><br/>您现在可以关闭本页面。</h3>
				</div>
			</div>
			<div id=f3>
				<h2>尝试中……</h2>
				<button id=bk2 type=button class='utility'>返回Wi-Fi设置</button>
			</div>
		</fieldset>
		<h4 id='st'>更新状态中……</h4>
	</div>
	<script>
		var $ = function (selector) { return document.querySelector(selector); };
		var ab = $('#networks'), ap = $('#aplist');
		var stopAll = false, ra, rs, submitted = false;

		$.urlParam = function (name) {
			var results = new RegExp('[\?&]' + name + '=([^&#]*)').exec(window.location.href);
			if (results == null) { return null;}
			else { return decodeURI(results[1]) || 0;}
		}
		function show(f, y) {
			if (y == null) y = f;
			$(f).style.display = y == f ? 'block' : 'none';
		}
		function hide(f) {
			$(f).style.display = 'none';
		}
		function to(cb, x) {
			return setTimeout(cb, 1000 * x);
		}
		function refr() {
			if (!stopAll)
				fetch('/status.json?n=' + Math.random(), 'GET', newSt, 2);
		}
		function cur(f) {
			show('#f1', f);
			show('#f2', f);
			show('#f3', f);
		}
		function newSt(s, d) {
			clearTimeout(rs);
			rs = to(refr, 3);

			if (s != 200) {
				$('#st').innerText = '等待状态（' + s + '）';
			} else {
				if (typeof d === 'string') {
					d = JSON.parse(d);
				}

				$('#deviceId').innerText = "设备：" + d.deviceid;

				var c = d.pairing;

				var st = [
					'空闲',
					'连接中……',
					'失败：密码错误',
					'失败：找不到网络',
					'失败',
					'Wi-Fi已连接！'
				][d.status];

				if (st == null)
					st = "";

				if (!submitted && d.status > 1 && d.status < 5)
					st = "需要有效的网络名称和密码";

				$('#st').innerText = st;

				if (d.status === 5) {
					cur('#f2');
					stopAll = true;
					clearTimeout(ra);
				} else if (d.status > 1) {
					cur('#f1');
				}
			}
		}
		function fetch(url, method, callback, time_out) {
			var xhr = new XMLHttpRequest();
			xhr.onloadend = function () {
				callback(xhr.status, xhr.responseText);
			}
			xhr.ontimeout = function () {
				callback(-1, null);
			}
			xhr.open(method, url, true);
			xhr.setRequestHeader('Accept', 'application/json');
			xhr.timeout = (time_out || 10) * 1000;
			xhr.send();
		}
		function gotAp(s, json) {
                  var list;
                  if (s === 200 && json != null) {
                    if (typeof json === 'string' && json.length > 0) {
                      list = JSON.parse(json);
                    } else if (typeof json === 'object') {
                      list = json;
                    }

                    list.sort(function (a, b) {
                      return b.rssi - a.rssi;
                    });
                    var ops = '<option>选择网络……</option>';
                    var seen = {};
                    for (var i = 0; i < list.length; ++i) {
                      var ssid = list[i].ssid;
                      if (!seen[ssid]) {
                          seen[ssid] = 1;
                          ops += '<option data-auth=' + list[i].auth + '>' + 
                            ssid.replace(/&/g, "&amp;").replace(/>/g, "&gt;").replace(/</g, "&lt;") + '</option>';
                      }
                    }
                    ap.innerHTML = ops;
                    ab.disabled = false;
                    togAp(null, true);
                    ab.onclick = togAp;
                  } else {
                    ab.innerText = '找不到网络（' + s + '）';
                    ra = to(refrAp, 5);
                  }
		}
		function togAp(ev, force) {
			if (!force || ap.style.display == 'block') {
                          hide('#dropdown');
                          show('#ssid');
                          ab.innerText = '扫描网络';
                          ab.onclick = refrAp;
			} else {
                          show('#dropdown');
                          hide('#ssid');
                          ab.innerText = '手动输入';
			}
                        let pw = $('#wifi_password');
                        pw.placeholder = "Wi-Fi密码";
                        pw.disabled = false;
                        pw.required = true;
		}
		function refrAp() {
			ab.innerText = '正在扫描网络……';
			ab.disabled = true;
			ap.innerHTML = '<option disabled>扫描中……</option>';
			if (!stopAll)
				fetch('/aplist?n=' + Math.random(), 'GET', gotAp, 10);
		}
		window.onload = function() {
			let trying = $.urlParam('trying');
			ab.innerText = '扫描网络';
			ab.onclick = refrAp;
			$('#aplist').onchange = function () {
                          $('#ssid').value = $('#aplist').value;
                          let pw = $('#wifi_password');
                          if ($('#aplist').selectedOptions[0].dataset.auth > 0) {
                            pw.placeholder = "Wi-Fi密码";
                            pw.disabled = false;
                            pw.required = true;
                          } else {
                            pw.placeholder = "开放网络——无需密码";
                            pw.disabled = true;
                            pw.required = false;
                          }
			};
			$('#bk2').onclick = function () {
				cur('#f1')
			}
			rs = to(refr, 0.5);
			if( trying ) cur("#f3");
                      refrAp();
		}
  </script>
</body>

</html>
