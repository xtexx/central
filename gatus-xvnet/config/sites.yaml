preset-ext-alerts: &alerts
  alerts:
    - type: ntfy

endpoints:
  - name: "Xensor V Ntfy"
    group: service
    url: "https://ntfy.xvnet.eu.org/v1/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].healthy == true"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    <<: *alerts
