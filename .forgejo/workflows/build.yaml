on:
  # push:
  #   branches: [main]
  # schedule:
  #   - cron: "0 3 * * 6"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: codeberg-medium
    container:
      image: "docker.io/library/alpine"

    steps:
      - name: Install dependencies
        run: apk add --no-cache bash nodejs git buildah netavark
      - name: Setup Buildah
        uses: https://codeberg.org/qikp/setup-buildah@main
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Login to Codeberg
        run: buildah login codeberg.org -u xvbot -p ${{ secrets.CODEBERG_TOKEN }}
      - name: Build
        run: |
          buildah build \
            -t codeberg.org/xens/x-mediawiki \
            -f contrib/Containerfile \
            .
      - name: Push
        run: buildah push codeberg.org/xens/x-mediawiki
