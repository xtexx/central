preset-extra-alerts: &alerts
  alerts:
    - type: telegram
    - type: discord

endpoints:
  - name: "OSDev Wiki"
    group: 02-extra
    url: "https://osdev.wiki/w/api.php?action=query&format=json&meta=siteinfo&formatversion=2&siprop=general"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].query.general.sitename == OSDev.wiki"
      - "[CERTIFICATE_EXPIRATION] > 48h"
      - "[DOMAIN_EXPIRATION] > 720h"
    <<: *alerts
  - name: "Project Archive"
    group: 02-extra
    url: "https://lakeus.xyz/w/api.php?action=query&format=json&meta=siteinfo&formatversion=2&siprop=general"
    interval: 15m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].query.general.sitename == 存档计划"
      - "[CERTIFICATE_EXPIRATION] > 48h"
    <<: *alerts
  - name: "Minecraft Wiki"
    group: 02-extra
    url: "https://meta.minecraft.wiki/api.php?action=query&format=json&meta=siteinfo&formatversion=2&siprop=general"
