preset-domains: &domains
  group: xtex-domain
  interval: 1h
  conditions:
    - "[DOMAIN_EXPIRATION] > 720h"

endpoints:
  - name: "xtex's Home"
    group: xtex-site
    url: "https://xtexx.eu.org/nodeinfo/2.1.json"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].software.name == xtex-home"
      - "[CERTIFICATE_EXPIRATION] > 72h"
  - name: "xtex's Blog"
    group: xtex-site
    url: "https://blog.xtexx.eu.org/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 72h"
  - name: "xtex's Uptime"
    group: xtex-site
    url: "https://uptime.xtexx.eu.org/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 72h"
  - name: "xtex's Upptime"
    group: xtex-site
    url: "https://upptime.xtexx.eu.org/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 72h"
  - name: xtexx.eu.org
    <<: *domains
    url: "https://xtexx.eu.org"
  - name: xtexx.us.kg
    <<: *domains
    url: "https://xtexx.us.kg"
  - name: hgdns.ren
    <<: *domains
    url: "https://hgdns.ren"
  - name: "yjyz-tools"
    group: yjyz-tools
    url: "https://yjyz.us.kg/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 72h"
  - name: yjyz.us.kg
    <<: *domains
    group: yjyz-tools
    url: "https://yjyz.us.kg"
