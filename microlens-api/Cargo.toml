[package]
name = "microlens-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.1", default-features = false, features = [
	"original-uri",
	"matched-path",
	"query",
	"json",
	"form",
	"macros",
] }
futures = "0.3.31"
kstring = { version = "2.0.2", features = ["serde"] }
microlens-core = { version = "0.1.0", path = "../microlens-core" }
ouroboros = "0.18.5"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
thiserror = "2.0.11"
time = { version = "0.3.37", features = ["serde"] }
uuid = { version = "1.12.1", features = ["v7"] }
